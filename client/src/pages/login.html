<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../styles/login.css" />
    <title>Acessar</title>
  </head>
  <body>
    <main>
      <form>
        <h1>Acessar</h1>
        <label for="email">Email *</label>
        <input type="email" id="email" placeholder="Digite seu email" />
        <label for="password">Senha *</label>
        <input type="password" id="password" placeholder="Digite sua senha" />
        <div class="password-options">
          <input type="checkbox" id="checkbox-password" />
          <label for="checkbox-password" id="label-password"> Mostrar senha </label>
        </div> 
        <button>Acessar</button>
        <p>Esqueceu a senha? Recupere-a <a href="./recovery.html">aqui</a></p>
        <p>
          Não possui Cadastro? Registre-se <a href="./register.html">aqui</a>
        </p>
      </form>
    </main>

    <script src="../scripts/login.js"></script>
  </body>
</html>
